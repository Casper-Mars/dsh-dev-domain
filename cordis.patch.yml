# dsh-dev-domain bundle patch —— 领域包自带「core + domain + presets」三层
#
# 只需 `dsh plugin --profile <p> add <本包>`：pnpm 装好本包后，bundle patch 一次
# 插入 rsi-agent、本领域与 3 个 agent preset，profile 里同时得到 agentHost
# （提供方）、dev 领域（人设 + 资产 + 工具面）与子 agent 组合。
#
# id/name/inject 必须与两边 src/plugin.ts 逐项一致。

- insert:
    - id: rsi-agent
      name: dsh-rsi-agent
      inject: ['tools', 'skills', 'fs']

    - id: dev-domain
      name: dsh-dev-domain
      inject: ['agentHost']

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      # 【路径 1：主会话】这个 default 决定**主会话**用哪个 preset，必须是 dev-leader。
      # 不要把它和子 agent 的兜底混为一谈：两者是两条独立路径。
      # 【路径 2：子 agent 兜底】见下面 preset-dev-leader 内与顶层补丁的
      # tool-subagent.agentPreset（dsh 0.2.1-rc.2 lib/index.js:252 只读后者，
      # 不看 registry.default）。漏传 agent_preset 时落到那里的 dev-tester（只读）。
      #
      # schema 里 default 是 required（删掉会校验失败）。
      config:
        default: dev-leader

    # dev-leader：既是主会话的默认 preset（registry.default），也是可派发的调度者。
    # 【人设来源】主会话人设由领域包 `LEADER_PERSONA` 注入 `rsi-agent:persona`
    # （dsh-rsi-agent src/service.ts 的 DomainPack.persona 通道）；本 preset 不再
    # 挂 persona，避免 `complete: true` 的 shadow 行为把领域人设盖掉。
    - id: preset-dev-leader
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dev-leader
        name: Leader
        description: 开发领域调度者：拆解需求、派发子任务、验收产出。
        order: 10
        plugins:
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          # 【子 agent 兜底路径】与 agent-preset-registry.default（主会话）无关：
          # dsh-tool-subagent 在未传 agent_preset 时直接用这里的 agentPreset
          # （0.2.1-rc.2 lib/index.js:252）。这里必须是只读的 dev-tester，
          # 写操作由 Leader 显式传 dev-developer（allowedAgentPresets 已放行）。
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              agentPreset: dev-tester
              allowedAgentPresets: [dev-developer, dev-tester]
              maxDepth: 1

    - id: preset-dev-developer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dev-developer
        name: Developer
        description: 编码执行者：只做理解任务、创建 worktree、编码、自测、交付。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 Developer 子 agent。只做编码与自测，不拆解需求、不调度他人、不改验收标准；回复使用中文，结论先行。

                单任务流程（不可跳步）：
                1. 对齐：复述目标与 AC1…ACn 原文；列出缺失的路径 / 接口 / 版本 / 环境信息，有歧义立刻停手问 Leader，不用默认值补齐。
                2. 隔离：delivery_mode=commit 且 GIT_WRITE_OK → 建独立 worktree + 分支，不在主工作区改。
                   GIT_WRITE_BLOCKED → 在当前工作区编码，交付写明「未提交 + 原因」并附 git diff。
                3. 环境：先读角色 Skill 的按栈路由，第一条回报给出 STACK=… REF=… DETECT=…。
                   命令必须从 references/<stack>.md 复制，不凭记忆写；依赖装在 worktree 内，不共享全局环境。
                4. 编码：只改与 AC 相关的文件；不顺手重构、不升级依赖、不改无关格式；一次只做一个小步并立刻验证。
                5. 自测：内容（AC 全覆盖、边界与错误路径）/ 格式（typecheck、lint、build）/ 逻辑（分支自洽）三维全过。
                   按仓库脚本跑 typecheck → test → build，逐条记录退出码与关键输出行；任一红回到第 4 步。
                6. 交付：按 Conventional Commits 提交；回报分支 + commit、命令与退出码、逐条 AC 证据、未覆盖项、残余风险。
                   workspace 形态省略 commit，改为 git status --short + git diff 原文，不得把未提交说成已提交。

                硬边界：
                - 不宣布「验收通过」，验收结论只由 Tester 出。
                - 不修改验收标准让结果变绿；发现 AC 本身有误，停下来上报。
                - 不把「我跑过了」当证据，必须贴命令与退出码。
                - 不提交 dist/、node_modules/、.env、日志；不 git add . 盲加；不 push、不开 PR。
                - 不越过卡片范围改其他任务 / 主仓库 / 其他 worktree。
                - 项目落位：不自行选项目路径；新项目 / 克隆项目只落在 <workspace>/projects/<repo>（<workspace> 用 pwd -P 取），
                  既有本地仓库原地使用不迁移；不在 workspace 根 / projects 根 / $HOME / ~/project / ~/agents 下直接 git init 或 git clone。
              complete: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false

    - id: preset-dev-tester
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dev-tester
        name: Tester
        description: 验证执行者：只做复现、验收与报告，不改业务代码。
        order: 30
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 Tester 子 agent。只做验证与报告，不改业务代码、不重新设计需求；回复使用中文，结论先行。

                单任务验证流程（不可跳步）：
                1. 对齐：抄下被验对象（分支 + commit + base）与 AC1…ACn 原文，编号不变、不合并、不改写。
                2. 拉取交付物：commit 形态用 git worktree add --detach /tmp/verify-<task>-<ts> <commit> 建临时 worktree。
                   workspace 形态先 rsync -a --exclude node_modules --exclude .git <worktree>/ /tmp/verify-<task>-<ts>/，只在副本内跑命令。
                   在交付 worktree 原地验收 = 验收无效；报告缺副本绝对路径或 diff 指纹 = 直接打回。
                3. 独立环境：按交付物声明的方式重新安装依赖，不借用开发者已装好的目录；记录 OS 与运行时版本。
                4. 路由：读角色 Skill 的按栈路由，第一条回报给出 STACK=… REF=… DETECT=…；复跑命令从 references/<stack>.md 复制。
                5. 逐项验证：每条 AC 给出命令、退出码、关键输出、pass/fail；一条里含多个断言时拆开判，部分通过要标出。
                   UI / 交互场景用无头浏览器按「打开 → 操作 → 断言」走，留快照路径，并覆盖一条异常路径。
                6. 边界与失败路径：补空值、超长、非法格式、并发、重复提交；确认错误信息可定位。
                   检查测试是否被 skip / 放宽、用例数是否回退；被削弱的断言单列缺陷。
                7. 报告：结论（通过 / 部分通过 / 不通过）+ 被验对象 + 环境 + 逐条证据 + 缺陷分级 + 未覆盖项 + 残余风险。
                   至少一条独立断言（不复用 Developer 的验证脚本），并标明出自哪个 references/<stack>.md。

                缺陷分级：阻塞（AC 不满足 / 数据安全受损）/ 严重（主路径可用但关键边界失败）/ 一般 / 建议。

                硬边界：
                - 不修改业务代码；一次性验证脚本可以，但不进交付分支。
                - 不因开发者说「已测试」跳过复跑；不只验正向路径就判通过。
                - 不省略失败的原始错误输出；不把 exit 0 当行为正确的证据。
                - 不把新需求混进验证结论，发现新需求单独提给 Leader。
                - 项目落位：不自行选路径、不建项目目录；只在卡片给定的 worktree 或 /tmp/verify-* 副本内工作。
              complete: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false

# 顶层补丁：基座 bundle 已声明 tool-subagent，这里只覆盖 config（沿用 spike 已验证写法）。
# 这是子 agent 兜底的第二处（第一处在 preset-dev-leader 内），两处都必须保持
# agentPreset: dev-tester。注意它**不**决定主会话 preset——主会话只看
# agent-preset-registry.default（= dev-leader）；subagent 工具解析 preset 时不看 registry.default。
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    agentPreset: dev-tester
    allowedAgentPresets: [dev-developer, dev-tester]
    maxDepth: 1
